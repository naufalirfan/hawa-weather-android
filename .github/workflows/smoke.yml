name: Emulator smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android Lint (release)
        run: gradle lintRelease --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Boot emulator, install, launch, check widget
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set -e
            adb logcat -c
            gradle connectedDebugAndroidTest --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.naufal.hawaweather/.MainActivity
            # tunggu WebView selesai memuat halaman (maks 120s)
            for i in $(seq 1 60); do
              adb logcat -d | grep -q "HawaWeb.*PAGE_FINISHED" && break
              sleep 2
            done
            adb logcat -d > /tmp/logcat.txt
            echo "--- page load ---"
            grep "HawaWeb" /tmp/logcat.txt | tail -20
            grep -q "HawaWeb.*PAGE_FINISHED https://hawa-weather.vercel.app" /tmp/logcat.txt \
              || (echo "PAGE NOT LOADED"; exit 1)
            ! grep "HawaWeb.*PAGE_ERROR" /tmp/logcat.txt \
              || (echo "PAGE ERROR"; exit 1)
            echo "--- widget provider ---"
            adb shell dumpsys appwidget | grep -q "cmp:ComponentInfo{com.naufal.hawaweather/com.naufal.hawaweather.HawaWidget" \
              || (echo "WIDGET PROVIDER NOT REGISTERED"; exit 1)
            echo "--- crashes ---"
            ! grep -E "FATAL EXCEPTION|AndroidRuntime: E " /tmp/logcat.txt \
              || (echo "CRASH DETECTED"; exit 1)
            echo "--- resumed ---"
            adb shell dumpsys activity activities | grep -q "topResumedActivity.*com.naufal.hawaweather/.MainActivity" \
              || (echo "APP NOT IN FOREGROUND"; exit 1)
            adb exec-out screencap -p > /tmp/screen.png
            echo SMOKE_OK

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screen
          path: /tmp/screen.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logcat
          path: /tmp/logcat.txt
          if-no-files-found: ignore
