name: Emulator smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android Lint (release)
        run: gradle lintRelease --stacktrace

      - name: Assemble debug
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Boot emulator, install, launch, check widget
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set -e
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm list packages | grep com.naufal.hawaweather
            adb shell am start -W -n com.naufal.hawaweather/.MainActivity
            sleep 15
            echo "--- resumed activity ---"
            adb shell dumpsys activity activities | grep -E "ResumedActivity|topResumedActivity" || true
            echo "--- widget providers ---"
            adb shell dumpsys appwidget | grep -i -A3 hawaweather || (echo "WIDGET PROVIDER NOT REGISTERED"; exit 1)
            echo "--- crashes ---"
            adb logcat -d > /tmp/logcat.txt
            ! grep -E "FATAL EXCEPTION|AndroidRuntime: E " /tmp/logcat.txt
            echo "--- webview ---"
            grep -c "chromium" /tmp/logcat.txt || true
            ! grep -E "chromium.*(ERR_|net::ERR)" /tmp/logcat.txt
            adb exec-out screencap -p > /tmp/screen.png
            ls -l /tmp/screen.png
            echo SMOKE_OK

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screen
          path: /tmp/screen.png
          if-no-files-found: ignore
